<!-- Generic confirm modal, driven by JS (main.js) via data-confirm attributes -->
<div class="modal-backdrop" id="confirmModalBackdrop">
  <div class="modal-box" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h3 id="confirmModalTitle">Are you sure?</h3>
      <button class="modal-close" type="button" id="confirmModalClose" aria-label="Close">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <p class="text-muted" id="confirmModalBody">This action cannot be undone.</p>
    <div class="row mt-24" style="justify-content:flex-end;">
      <button class="btn btn-outline" type="button" id="confirmModalCancel">Cancel</button>
      <button class="btn btn-danger" type="button" id="confirmModalAccept">
        <span class="btn-spinner"></span><span class="btn-label">Confirm</span>
      </button>
    </div>
  </div>
</div>

<!-- Session timeout warning modal -->
<div class="modal-backdrop" id="sessionWarningBackdrop">
  <div class="modal-box" role="dialog" aria-modal="true">
    <div class="modal-header">
      <h3>Session expiring soon</h3>
    </div>
    <p class="text-muted">For your security, you'll be signed out due to inactivity in:</p>
    <div class="session-warning-time" id="sessionCountdown">05:00</div>
    <div class="row" style="justify-content:center;">
      <button class="btn btn-primary" type="button" id="extendSessionBtn">
        <span class="btn-spinner"></span><span class="btn-label">Stay signed in</span>
      </button>
    </div>
  </div>
</div>
