<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <title>404 · Scholaris</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/glassmorphism.css') }}">
  <style>
    body { margin: 0; background: #0d0e17; }
    .err-page {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; flex-direction: column; gap: 0;
      background: radial-gradient(ellipse at 50% 30%, rgba(201,149,42,.07) 0%, transparent 70%),
                  #0d0e17;
    }
    .err-canvas-wrap {
      line-height: 1; user-select: none;
    }
    canvas { display: block; }
    .err-msg {
      font-family: 'Inter', sans-serif;
      color: rgba(255,255,255,.45);
      font-size: 15px;
      letter-spacing: .02em;
      margin-top: 6px;
      text-align: center;
    }
    .err-home {
      margin-top: 32px;
      display: inline-flex; align-items: center; gap: 8px;
      padding: 11px 28px; border-radius: 999px;
      background: #c9952a; color: #fff;
      font-family: 'Inter', sans-serif; font-weight: 700; font-size: 14px;
      text-decoration: none;
      transition: opacity 180ms, box-shadow 180ms;
      box-shadow: 0 0 0 0 rgba(201,149,42,0);
    }
    .err-home:hover {
      opacity: .88;
      box-shadow: 0 0 24px rgba(201,149,42,.45);
    }
  </style>
</head>
<body>
  <div class="err-page">
    <div class="err-canvas-wrap">
      <canvas id="fuzzyCanvas"></canvas>
    </div>
    <p class="err-msg">That page doesn't exist.</p>
    <a href="{{ url_for('index') }}" class="err-home">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      Go home
    </a>
  </div>
  <script src="{{ url_for('static', filename='js/fuzzy-text.js') }}"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      FuzzyText(document.getElementById('fuzzyCanvas'), '404', {
        fontSize: 'clamp(5rem, 22vw, 14rem)',
        fontWeight: 900,
        color: '#ffffff',
        baseIntensity: 0.18,
        hoverIntensity: 0.55,
        enableHover: true,
        fuzzRange: 30,
        fps: 60,
        clickEffect: true,
        glitchMode: true,
        glitchInterval: 3000,
        glitchDuration: 180,
      });
    });
  </script>
</body>
</html>
